<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flappy Bird</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell" aria-label="Flappy Bird game">
      <h1>Flappy Bird</h1>
      <p class="hint">Press <kbd>Space</kbd> or click/tap to flap. Press <kbd>R</kbd> to restart.</p>
      <canvas id="game" width="400" height="600" role="img" aria-label="Flappy Bird playfield"></canvas>
      <div class="hud" aria-live="polite">
        <span>Score: <strong id="score">0</strong></span>
        <span>Best: <strong id="best">0</strong></span>
      </div>
      <p id="status" class="status">Press Space to Start</p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
